<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดออมทรัพย์นักเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:16px;color:#222}
  .container{max-width:1200px;margin:0 auto}
  .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:24px;margin-bottom:16px}
  h1{font-size:1.4rem;color:#4a3f8f;margin-bottom:8px}
  .sub{color:#666;margin-bottom:16px;font-size:.95rem}
  input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:1rem;margin-bottom:10px;font-family:inherit}
  input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}
  button{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
  button:disabled{opacity:.6;cursor:not-allowed}
  .error{color:#c62828;font-size:.9rem;margin-top:8px;min-height:20px}
  .hidden{display:none!important}
  .book-header{background:linear-gradient(135deg,#fef3c7,#fde68a);padding:20px;border-radius:12px;margin-bottom:16px;border-left:6px solid #d97706}
  .book-header h2{color:#92400e;margin-bottom:6px;font-size:1.15rem}
  .book-header p{color:#78350f;font-size:.95rem;margin:2px 0}
  .actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
  .actions button{width:auto;flex:1;min-width:140px}
  .btn-outline{background:#fff;color:#4a3f8f;border:2px solid #4a3f8f}
  .logout{background:#f3f4f6;color:#374151;border:none}
  .loading{text-align:center;padding:40px;color:#666}
  .spinner{display:inline-block;width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media print{body{background:#fff;padding:0}.card{box-shadow:none;padding:0}.actions,.logout{display:none}}
</style>
</head>
<body>
<div class="container">
  <div id="loginView" class="card hidden">
    <h1>🏦 สมุดออมทรัพย์นักเรียน</h1>
    <p class="sub">พิมพ์ชื่อเล่นหรือชื่อที่ตรงกับชีทออมทรัพย์ของคุณ (เช่น สกาย)</p>
    <form id="loginForm" autocomplete="on">
      <input id="nameInput" type="text" placeholder="ชื่อเล่น เช่น สกาย" autocomplete="username" required>
      <button id="loginBtn" type="submit">ดูการออม</button>
    </form>
    <div id="loginError" class="error"></div>
  </div>

  <div id="loadingView" class="card hidden">
    <div class="loading"><div class="spinner"></div><p style="margin-top:12px">กำลังโหลด...</p></div>
  </div>

  <div id="dataView" class="hidden">
    <div class="card">
      <!-- นำส่วนแสดงข้อมูล (Header, Table, Summary) ออกตามคำขอ -->
      <div class="book-header">
        <h2 id="studentTitle">สมุดฝากออมทรัพย์</h2>
        <p id="studentClass">ชั้นประถมศึกษาปีที่ 6</p>
        <p id="studentSchool">โรงเรียนบ้านถิ่นสำราญ</p>
        <p id="studentYear">ปีการศึกษา 2569 - 2570</p>
      </div>
      
      <div class="actions" style="margin-top: 24px;">
        <button class="btn-outline" id="pdfBtn" type="button" style="padding: 16px; font-size: 1.1rem;">📄 ดาวน์โหลด PDF สมุดออมทรัพย์</button>
        <button class="logout" id="logoutBtn" type="button" style="padding: 16px; font-size: 1.1rem;">🚪 ออกจากระบบ</button>
      </div>
    </div>
  </div>
</div>

<script>
// ⚠️ URL ของ Tenant
const TENANT_API = 'https://script.google.com/macros/s/AKfycbzekZKZZd9WBVdNi6HXgzvZYkDfC1v2arTwOIE72oQxOf8hgKgCGUCVFYhQynO5SQkz2A/exec';
let currentPdfUrl = '';

function $(id){return document.getElementById(id);}
function show(id){['loginView','loadingView','dataView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}

function loadData(name) {
  show('loadingView');
  const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
  
  window[callbackName] = function(data) {
    delete window[callbackName];
    const script = document.getElementById('jsonp_script');
    if (script) document.body.removeChild(script);
    
    if(!data.ok) {
      show('loginView');
      $('loginError').textContent = data.error || 'ไม่พบข้อมูล';
    } else {
      // แสดงแค่ชื่อนักเรียน และเก็บ URL ของ PDF
      $('studentTitle').textContent = 'สมุดฝากออมทรัพย์ ของ ' + data.data.studentName;
      $('studentClass').textContent = data.data.className || '';
      $('studentSchool').textContent = data.data.schoolName || '';
      $('studentYear').textContent = data.data.year || '';
      currentPdfUrl = data.data.pdfUrl || '';
      
      show('dataView');
    }
  };
  
  const script = document.createElement('script');
  script.id = 'jsonp_script';
  script.src = TENANT_API + '?name=' + encodeURIComponent(name) + '&callback=' + callbackName + '&t=' + Date.now();
  
  script.onerror = function() {
    delete window[callbackName];
    if (script) document.body.removeChild(script);
    show('loginView');
    $('loginError').textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
  };
  
  document.body.appendChild(script);
}

$('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('nameInput').value.trim();
  if(!name)return $('loginError').textContent='กรุณาพิมพ์ชื่อ';
  $('loginError').textContent='';
  loadData(name);
});

$('logoutBtn').addEventListener('click',()=>{
  window.history.replaceState(null, '', window.location.pathname);
  show('loginView');
});

$('pdfBtn').addEventListener('click',()=>{
  if(currentPdfUrl)window.open(currentPdfUrl,'_blank');
  else alert('ยังไม่มีไฟล์ PDF สำหรับผู้ใช้นี้');
});

window.addEventListener('DOMContentLoaded',()=>{
  const urlParams = new URLSearchParams(window.location.search);
  const nameFromUrl = urlParams.get('name');
  
  if(nameFromUrl){
    loadData(nameFromUrl);
  } else {
    show('loginView');
  }
});
</script>
</body>
</html>
