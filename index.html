<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดออมทรัพย์นักเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:16px;color:#222}
  .container{max-width:1200px;margin:0 auto}
  .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:24px;margin-bottom:16px}
  h1{font-size:1.4rem;color:#4a3f8f;margin-bottom:8px}
  .sub{color:#666;margin-bottom:16px;font-size:.95rem}
  input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:1rem;margin-bottom:10px;font-family:inherit}
  input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}
  button{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
  button:disabled{opacity:.6;cursor:not-allowed}
  .error{color:#c62828;font-size:.9rem;margin-top:8px;min-height:20px}
  .hidden{display:none!important}
  
  /* ปรับ Header ให้อยู่กึ่งกลาง */
  .book-header{
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    padding:20px;
    border-radius:12px;
    margin-bottom:16px;
    border-left:6px solid #d97706;
    text-align: center; /* จัดกึ่งกลาง */
  }
  .book-header h2{color:#92400e;margin-bottom:6px;font-size:1.15rem;line-height: 1.4;}
  .book-header p{color:#78350f;font-size:.95rem;margin:2px 0}
  
  /* ปรับแต่งตารางให้เลื่อนและตรึงหัวตาราง */
  .table-wrap{
    overflow-x:auto; 
    overflow-y:auto; 
    max-height:65vh;
    border-radius:12px;
    border:1px solid #e5e7eb;
    margin-bottom:16px;
  }
  table{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff}
  thead{background:#4a3f8f;color:#fff}
  th{
    padding:10px 8px;
    text-align:left;
    font-weight:600;
    white-space:nowrap;
    font-size:.85rem;
    position:sticky;
    top:0;
    background:#4a3f8f;
    z-index:10;
  }
  td{padding:8px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
  tbody tr:nth-child(even) td{background:#fafafa}
  tbody tr:hover td{background:#eef2ff}
  .num{text-align:right;font-family:'Courier New',monospace}
  .balance{font-weight:600;color:#059669}
  
  .loading{text-align:center;padding:40px;color:#666}
  .spinner{display:inline-block;width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  
  /* Mobile Responsive */
  @media (max-width: 768px) {
    .card { padding: 10px; }
    
    /* ซ่อนคอลัมน์: ชื่อนักเรียน (2), ผู้รับฝาก (7), หมายเหตุ (8) */
    th:nth-child(2), td:nth-child(2),
    th:nth-child(7), td:nth-child(7),
    th:nth-child(8), td:nth-child(8) {
      display: none;
    }
    
    /* ปรับตารางให้พอดีหน้าจอ */
    table { 
      font-size: 0.7rem; 
      table-layout: fixed; /* ล็อคความกว้างคอลัมน์ */
      width: 100%;
    }
    
    /* กำหนดความกว้างของแต่ละคอลัมน์บนมือถือ เพื่อไม่ให้ทับซ้อน */
    th:nth-child(1) { width: 20%; } /* วันที่ */
    th:nth-child(3) { width: 15%; } /* ยอดยกมา */
    th:nth-child(4) { width: 15%; } /* ฝาก */
    th:nth-child(5) { width: 10%; } /* ถอน */
    th:nth-child(6) { width: 20%; } /* จำนวนคงเหลือ */
    th:nth-child(9) { width: 20%; } /* โอนให้นักเรียน */

    /* หัวตาราง: อนุญาตให้ตัดขึ้นบรรทัดใหม่ได้ */
    th {
      white-space: normal; 
      text-align: center;
      vertical-align: middle;
      padding: 6px 2px;
      font-size: 0.65rem;
      line-height: 1.2;
    }
    
    /* ข้อมูลในตาราง */
    td {
      padding: 8px 2px;
      text-align: center; /* จัดกึ่งกลางทั้งหมด */
      vertical-align: middle;
      font-size: 0.7rem;
    }
    
    /* ตัวเลขและเครื่องหมาย - ไม่ให้ตกบรรทัด */
    .num {
      text-align: center !important; 
      white-space: nowrap; 
    }

    /* คอลัมน์วันที่ ห้ามตกบรรทัด */
    td:nth-child(1) {
      white-space: nowrap;
    }
  }

  @media print{
    body{background:#fff;padding:0}
    .card{box-shadow:none;padding:0}
    .table-wrap{max-height:none;overflow:visible}
  }
</style>
</head>
<body>
<div class="container">
  <div id="loginView" class="card hidden">
    <h1>🏦 สมุดออมทรัพย์นักเรียน</h1>
    <p class="sub">พิมพ์ชื่อเล่นหรือชื่อที่ตรงกับชีทออมทรัพย์ของคุณ (เช่น สกาย)</p>
    <form id="loginForm" autocomplete="on">
      <input id="nameInput" type="text" placeholder="ชื่อเล่น เช่น สกาย" autocomplete="username" required>
      <button id="loginBtn" type="submit">ดูการออม</button>
    </form>
    <div id="loginError" class="error"></div>
  </div>

  <div id="loadingView" class="card hidden">
    <div class="loading"><div class="spinner"></div><p style="margin-top:12px">กำลังโหลด...</p></div>
  </div>

  <div id="dataView" class="hidden">
    <div class="card">
      <div class="book-header">
        <h2 id="studentTitle">สมุดฝากออมทรัพย์</h2>
        <p id="studentSchool">โรงเรียนบ้านถิ่นสำราญ</p>
      </div>
      
      <!-- ตารางข้อมูล -->
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>วันที่ออม</th>
              <th>ชื่อนักเรียน</th>
              <th class="num">ยอดยกมา</th>
              <th class="num">ฝาก</th>
              <th class="num">ถอน</th>
              <th class="num">จำนวนคงเหลือ</th>
              <th>ผู้รับฝาก</th>
              <th>หมายเหตุ</th>
              <th class="num">โอนให้นักเรียน</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const TENANT_API = 'https://script.google.com/macros/s/AKfycbzekZKZZd9WBVdNi6HXgzvZYkDfC1v2arTwOIE72oQxOf8hgKgCGUCVFYhQynO5SQkz2A/exec';

function $(id){return document.getElementById(id);}
function fmt(n){return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}

// แก้ไขฟังก์ชันวันที่ให้แสดง พ.ศ. 2 หลัก
function fmtDate(d){
  if(!d)return '';
  const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return d;
  const y = String(parseInt(m[1]) + 543).slice(-2); // เอาแค่ 2 หลักท้าย
  return m[3]+'/'+m[2]+'/'+y;
}

function show(id){['loginView','loadingView','dataView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}

function loadData(name) {
  show('loadingView');
  const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
  
  window[callbackName] = function(data) {
    delete window[callbackName];
    const script = document.getElementById('jsonp_script');
    if (script) document.body.removeChild(script);
    
    if(!data.ok) {
      show('loginView');
      $('loginError').textContent = data.error || 'ไม่พบข้อมูล';
    } else {
      renderStudent(data.data);
      show('dataView');
    }
  };
  
  const script = document.createElement('script');
  script.id = 'jsonp_script';
  script.src = TENANT_API + '?name=' + encodeURIComponent(name) + '&callback=' + callbackName + '&t=' + Date.now();
  
  script.onerror = function() {
    delete window[callbackName];
    if (script) document.body.removeChild(script);
    show('loginView');
    $('loginError').textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
  };
  
  document.body.appendChild(script);
}

function renderStudent(d){
  $('studentTitle').innerHTML = 'สมุดฝากออมทรัพย์<br><span style="font-size:1.1em; color:#78350f;">' + escapeHtml(d.studentName) + '</span>';
  $('studentSchool').textContent = d.schoolName || '';
  
  const tbody=$('txBody');
  tbody.innerHTML='';
  
  if(!d.transactions||!d.transactions.length){
    tbody.innerHTML='<tr><td colspan="9" style="text-align:center;color:#999;padding:24px">ยังไม่มีรายการ</td></tr>';
  }else{
    d.transactions.forEach(tx=>{
      // ลบแถวที่เป็น "รวมทั้งหมด" ออก
      if (String(tx.date).includes('รวม') || String(tx.student).includes('รวม')) return;

      const tr=document.createElement('tr');
      tr.innerHTML=
        '<td>'+fmtDate(tx.date)+'</td>'+
        '<td>'+escapeHtml(tx.student)+'</td>'+
        '<td class="num">'+fmt(tx.carry)+'</td>'+
        '<td class="num" style="color:#059669">'+(tx.deposit?fmt(tx.deposit):'-')+'</td>'+
        '<td class="num" style="color:#dc2626">'+(tx.withdraw?fmt(tx.withdraw):'-')+'</td>'+
        '<td class="num balance">'+fmt(tx.balance)+'</td>'+
        '<td>'+escapeHtml(tx.by)+'</td>'+
        '<td>'+escapeHtml(tx.note)+'</td>'+
        '<td class="num" style="color:#d97706">'+(tx.transfer?fmt(tx.transfer):'-')+'</td>';
      tbody.appendChild(tr);
    });
  }

  // Auto Scroll ลงไปที่แถวล่าสุด
  setTimeout(() => {
    const tableWrap = document.getElementById('tableWrap');
    if (tableWrap) {
      tableWrap.scrollTop = tableWrap.scrollHeight;
    }
  }, 150); 
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

$('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('nameInput').value.trim();
  if(!name)return $('loginError').textContent='กรุณาพิมพ์ชื่อ';
  $('loginError').textContent='';
  loadData(name);
});

window.addEventListener('DOMContentLoaded',()=>{
  const urlParams = new URLSearchParams(window.location.search);
  const nameFromUrl = urlParams.get('name');
  
  if(nameFromUrl){
    loadData(nameFromUrl);
  } else {
    show('loginView');
  }
});
</script>
</body>
</html>
