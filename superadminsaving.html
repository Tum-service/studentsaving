<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin - จัดการออมทรัพย์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:#f3f4f6;color:#222}
  .container{max-width:1400px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.1);padding:20px;margin-bottom:16px}
  h1{font-size:1.3rem;color:#1e293b;margin-bottom:12px}
  h2{font-size:1.1rem;color:#334155;margin-bottom:12px}
  h3{font-size:1rem;color:#475569;margin-bottom:8px}
  .login-box{max-width:400px;margin:100px auto;text-align:center}
  input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:0.95rem;margin-bottom:10px}
  button{background:#1e293b;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{background:#334155}
  button:disabled{opacity:.6;cursor:not-allowed}
  select:disabled{background:#f1f5f9;color:#94a3b8}
  .btn-red{background:#dc2626}
  .btn-red:hover{background:#b91c1c}
  .btn-green{background:#059669}
  .btn-green:hover{background:#047857}
  .btn-blue{background:#2563eb}
  .btn-blue:hover{background:#1d4ed8}
  .btn-gray{background:#64748b}
  .btn-gray:hover{background:#475569}
  .btn-sm{padding:4px 10px;font-size:0.8rem}
  .hidden{display:none!important}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:8px}
  table{width:100%;border-collapse:collapse;font-size:0.9rem}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0}
  th{background:#f8fafc;font-weight:600;position:sticky;top:0;z-index:1}
  tr:hover{background:#f1f5f9}
  th,td{white-space:nowrap}
  td.c-note{white-space:normal;max-width:12em;word-break:break-word}
  .acts{display:flex;gap:.35em}
  table .btn-sm{padding:.3em .75em;font-size:1em;min-height:0;line-height:1.3}
  .pick-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
  .form-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .form-group.full{grid-template-columns:1fr}
  label.lbl{display:block;font-size:0.8rem;color:#64748b;margin-bottom:4px;text-align:left}
  .form-box{background:#f8fafc;padding:16px;border-radius:8px;margin-bottom:16px;border:1px solid #e2e8f0}
  .form-box.editing{background:#fffbeb;border-color:#f59e0b}
  .hint{font-size:0.85rem;color:#64748b;margin-bottom:8px}
  .status{font-weight:bold;padding:4px 8px;border-radius:4px;font-size:0.8rem}
  .status-ok{background:#d1fae5;color:#065f46}
  .status-err{background:#fee2e2;color:#991b1b}
  .status-info{background:#e0f2fe;color:#075985}
  html{-webkit-text-size-adjust:100%}
  .only-m{display:none}
  .d-short{display:none}
  .btn-sm .i{display:none}
  input,select{min-width:0;max-width:100%}
  .form-group>div,.pick-row>div{min-width:0}
  @media (max-width:700px){
    body{overflow-x:hidden}
    .container{padding:10px}
    .card{padding:14px;border-radius:10px}
    .login-box{margin:40px auto}
    h1{font-size:1.1rem}
    .header{flex-wrap:wrap;gap:8px}
    input,select,textarea{font-size:16px;min-height:44px}
    input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
    button{min-height:44px}
    .pick-row{grid-template-columns:1fr}
    .pick-row button{width:100%;margin-bottom:0!important}
    .form-box{padding:12px}
    .form-group{grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px}
    .form-group>div:nth-child(1),.form-group>div:nth-child(5),.form-group>div:nth-child(6){grid-column:1/-1}
    label.lbl{font-size:.75rem}
    #saveBtn{flex:1}
    /* ตารางบนมือถือ: หน้าตาเหมือนจอใหญ่ ย่อทั้งตารางให้พอดีจอ (คำนวณใน fitScale) */
    .table-wrap{overflow-x:hidden}
    th,td{padding:.55em .5em}
    .btn-sm{min-height:0}
  }
</style>
</head>
<body>
<div class="container">
  <div id="loginView" class="login-box card">
    <h1>🔐 Super Admin Login</h1>
    <input id="adminPassword" type="password" placeholder="รหัสผ่าน" required>
    <button onclick="login()">เข้าสู่ระบบ</button>
    <p id="loginError" style="color:red;margin-top:10px;font-size:0.9rem"></p>
  </div>

  <div id="adminView" class="hidden">
    <div class="header">
      <h1>📊 ระบบจัดการออมทรัพย์ (Super Admin)</h1>
      <button class="btn-red" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div class="card">
      <h2>เลือกผู้รับฝาก → ผู้ฝาก</h2>
      <div class="pick-row">
        <div>
          <label class="lbl" for="receiverSelect">1) ผู้รับฝาก</label>
          <select id="receiverSelect" onchange="onReceiverChange()"></select>
        </div>
        <div>
          <label class="lbl" for="studentSelect">2) ผู้ฝาก</label>
          <select id="studentSelect" onchange="onStudentChange()" disabled></select>
        </div>
        <div>
          <button id="syncBtn" class="btn-green" style="margin-bottom:10px" onclick="syncTabs()">🔄 Sync สร้างโฟลเดอร์/ไฟล์ใหม่</button>
        </div>
      </div>
    </div>

    <div id="txSection" class="card hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap">
        <h2 id="txTitle" style="margin-bottom:0">รายการเดินบัญชี</h2>
        <div>
          <span id="liveStamp" class="hint" style="margin-right:8px"></span>
          <button class="btn-gray" style="margin-right:8px" onclick="loadTransactions()">🔄 โหลดใหม่</button>
        </div>
      </div>

      <div id="formBox" class="form-box">
        <h3 id="formTitle">➕ เพิ่มรายการใหม่</h3>
        <div class="form-group">
          <div>
            <label class="lbl" for="addDate">วันที่</label>
            <input type="date" id="addDate">
          </div>
          <div>
            <label class="lbl" for="addDeposit">ฝาก (บาท)</label>
            <input type="number" id="addDeposit" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
          </div>
          <div>
            <label class="lbl" for="addWithdraw">ถอน (บาท)</label>
            <input type="number" id="addWithdraw" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
          </div>
          <div>
            <label class="lbl" for="addTransfer">โอนให้นักเรียน (บาท)</label>
            <input type="number" id="addTransfer" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
          </div>
          <div>
            <label class="lbl" for="addBy">ผู้รับฝาก (เปลี่ยนชื่อได้)</label>
            <input type="text" id="addBy" placeholder="ผู้รับฝาก">
          </div>
          <div>
            <label class="lbl" for="addNote">หมายเหตุ</label>
            <input type="text" id="addNote" placeholder="หมายเหตุ">
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button id="saveBtn" class="btn-green" onclick="saveTransaction()">บันทึกรายการ</button>
          <button id="cancelEditBtn" class="btn-gray hidden" onclick="resetForm()">ยกเลิกการแก้ไข</button>
        </div>
        <p id="addStatus" style="margin-top:8px;font-size:0.9rem"></p>
      </div>

      <p id="txHint" class="hint"></p>
      <div id="tableWrap" class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="c-date">วันที่</th>
              <th class="num c-carry">ยอดยกมา</th>
              <th class="num">ฝาก</th>
              <th class="num">ถอน</th>
              <th class="num">โอน</th>
              <th class="num">คงเหลือ</th>
              <th class="c-by">ผู้รับฝาก</th>
              <th class="c-note">หมายเหตุ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const MASTER_API = 'https://script.google.com/macros/s/AKfycbwUEz0s2i9SQQ6hWVUpg0mIr8Oq-4ckJxhYR_vuy5sVwG6tyBMiMsQhu2ki03F3ceF3/exec';
function isMobile(){return false;}   // มือถือใช้ตารางเดียวกับจอใหญ่ (ย่อสัดส่วนให้พอดีจอ)
function visRows(){return 5;}          // คอมพิวเตอร์: โชว์ 5 รายการล่าสุดในกรอบ (มือถือไม่มีกรอบเลื่อนซ้อน)
let shownMax=10;                       // มือถือ: โชว์กี่รายการล่าสุด กด "ดูรายการก่อนหน้า" เพื่อเพิ่ม
function showMore(){shownMax+=15;renderTransactions();}
const UNASSIGNED = '__unassigned__';

let adminPassword = '';
let currentTabName = '';
let receiverData = { receivers: [], unassigned: [] };
let txCache = [];
let editingRow = null;
let busy = false;

/* ---- ตัวแปรสำหรับระบบบันทึกเร็ว ---- */
const txStore = {};            // รายการล่าสุดของแต่ละแท็บ (สลับนักเรียนแล้วเห็นทันที)
let opQueue = Promise.resolve(), pendingOps = 0;
function clone(a) { return JSON.parse(JSON.stringify(a || [])); }

function $(id){return document.getElementById(id);}
function show(id){['loginView','adminView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function fmt(n){return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addOpt(sel,value,text){
  const o=document.createElement('option');
  o.value=value;o.textContent=text;sel.appendChild(o);
}
function saveLogin(p){try{localStorage.setItem('admin_pass',p);}catch(e){}}
function clearLogin(){try{localStorage.removeItem('admin_pass');}catch(e){}}

/* ---------- เรียก Master Web App แบบ JSONP (วิธีเดียวกับตอนล็อกอิน) ---------- */
function api(params,timeoutMs){
  return new Promise(function(resolve,reject){
    const cb='jsonp_cb_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
    const s=document.createElement('script');
    let finished=false;
    const cleanup=function(){
      clearTimeout(timer);
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
    };
    const timer=setTimeout(function(){
      if(finished)return;
      finished=true;
      cleanup();
      window[cb]=function(){delete window[cb];};
      reject(new Error('เซิร์ฟเวอร์ตอบช้าเกินไป กรุณาลองใหม่'));
    },timeoutMs||90000);
    window[cb]=function(data){
      if(finished)return;
      finished=true;
      cleanup();
      resolve(data);
    };
    s.onerror=function(){
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (กรุณา Deploy Master เป็น New version)'));
    };
    const q=Object.assign({password:adminPassword},params,{callback:cb,t:Date.now()});
    s.src=MASTER_API+'?'+Object.keys(q).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(q[k]==null?'':q[k]);
    }).join('&');
    document.body.appendChild(s);
  });
}

function setStatus(text,kind){
  const el=$('addStatus');
  el.innerHTML='';
  if(!text)return;
  const sp=document.createElement('span');
  sp.className='status'+(kind?' status-'+kind:'');
  sp.textContent=text;
  el.appendChild(sp);
}

/* ---------- Login / Logout ---------- */
async function login(){
  const pass=$('adminPassword').value;
  if(!pass)return alert('กรุณากรอกรหัสผ่าน');
  $('loginError').textContent='กำลังตรวจสอบและโหลดรายชื่อ...';
  try{
    const data=await api({action:'getReceivers',password:pass},90000);
    if(!data.ok){
      let msg=data.error||'เข้าสู่ระบบไม่สำเร็จ';
      if(data.error==='unauthorized'){msg='รหัสผ่านไม่ถูกต้อง';clearLogin();}
      else if(data.error==='unknown action'){msg='Master ยังเป็นโค้ดเก่า (ต้อง Deploy เป็น New version)';}
      $('loginError').textContent=msg;
      return;
    }
    $('loginError').textContent='';
    adminPassword=pass;
    saveLogin(pass);
    receiverData=data.data||{receivers:[],unassigned:[]};
    show('adminView');
    populateReceivers();
    onReceiverChange();
    startPolling();
  }catch(e){
    $('loginError').textContent=e.message;
  }
}

function logout(){
  clearLogin();
  adminPassword='';
  stopPolling();
  currentTabName='';
  show('loginView');
  $('adminPassword').value='';
  $('loginError').textContent='';
}

/* ---------- ผู้รับฝาก -> ผู้ฝาก ---------- */
function populateReceivers(){
  const sel=$('receiverSelect');
  sel.innerHTML='';
  addOpt(sel,'','-- เลือกผู้รับฝาก --');
  receiverData.receivers.forEach(function(r){
    addOpt(sel,r.name,r.name+' ('+r.students.length+' คน)');
  });
  if(receiverData.unassigned.length){
    addOpt(sel,UNASSIGNED,'(ยังไม่มีผู้รับฝากใน Excel) ('+receiverData.unassigned.length+' คน)');
  }
}

function studentsOf(key){
  if(key===UNASSIGNED)return receiverData.unassigned;
  const r=receiverData.receivers.find(function(x){return x.name===key;});
  return r?r.students:[];
}

function fillStudents(){
  const key=$('receiverSelect').value;
  const sel=$('studentSelect');
  sel.innerHTML='';
  if(!key){
    addOpt(sel,'','-- เลือกผู้รับฝากก่อน --');
    sel.disabled=true;
    return;
  }
  const list=studentsOf(key);
  addOpt(sel,'','-- เลือกผู้ฝาก ('+list.length+' คน) --');
  list.forEach(function(s){addOpt(sel,s.tabName,s.fullName+' ('+s.tabName+')');});
  sel.disabled=false;
}

function defaultBy(){
  const k=$('receiverSelect').value;
  return (k&&k!==UNASSIGNED)?k:'';
}

function onReceiverChange(){
  currentTabName='';
  editingRow=null;
  setStatus('');
  $('txSection').classList.add('hidden');
  fillStudents();
}

function onStudentChange(){
  const tab=$('studentSelect').value;
  setStatus('');
  editingRow=null;
  if(!tab){
    currentTabName='';
    $('txSection').classList.add('hidden');
    return;
  }
  currentTabName=tab;
  shownMax=10;
  txCache=clone(txStore[tab]);                    // แสดงจากแคชทันที แล้วค่อยรีเฟรชเบื้องหลัง
  $('txSection').classList.remove('hidden');
  $('txTitle').textContent='รายการเดินบัญชี: '+tab;
  resetForm();
  if(txStore[tab])renderTransactions();else $('txBody').innerHTML='';
  loadTransactions();
}

async function reloadReceivers(){
  const data=await api({action:'getReceivers'},90000);
  if(!data.ok)throw new Error(data.error||'โหลดรายชื่อไม่สำเร็จ');
  applyReceivers(data.data);
}
function applyReceivers(d){
  receiverData=d;
  const prevR=$('receiverSelect').value;
  const prevS=$('studentSelect').value;
  populateReceivers();
  const has=function(sel,v){return Array.prototype.some.call(sel.options,function(o){return o.value===v;});};
  if(prevR&&has($('receiverSelect'),prevR)){
    $('receiverSelect').value=prevR;
    fillStudents();
    if(prevS&&has($('studentSelect'),prevS)){
      $('studentSelect').value=prevS;
    }else{
      currentTabName='';
      $('txSection').classList.add('hidden');
    }
  }else{
    onReceiverChange();
  }
}

/* ---------- โหลด/แสดงรายการ ---------- */
let loadingNow=false, loadingTab='';
async function loadTransactions(silent){
  const tabName=currentTabName;
  if(!tabName||(loadingNow&&loadingTab===tabName))return;   // กันยิงซ้อนของแท็บเดียวกัน
  loadingNow=true;loadingTab=tabName;
  if(!txStore[tabName])$('txHint').textContent='กำลังโหลดรายการ...';
  try{
    const data=await api({action:'getTransactions',tabName:tabName},90000);
    if(tabName!==currentTabName||pendingOps)return;   // ระหว่างมีงานค้างในคิว ใช้ผลจากคิวแทน
    if(!data.ok)throw new Error(data.error||'ไม่ทราบสาเหตุ');
    const rows=data.data||[];
    const changed=JSON.stringify(rows)!==JSON.stringify(txStore[tabName]);
    txStore[tabName]=rows;
    $('liveStamp').textContent='v7 · อัปเดตล่าสุด '+new Date().toLocaleTimeString('th-TH');
    if(changed){txCache=clone(rows);renderTransactions();}   // เปลี่ยนเมื่อข้อมูลในชีตต่างจากที่แสดงเท่านั้น
  }catch(e){
    if(!silent&&tabName===currentTabName){
      $('txHint').textContent='';
      alert('โหลดข้อมูลไม่สำเร็จ: '+e.message);
    }
  }finally{
    if(loadingTab===tabName)loadingNow=false;
  }
}

function renderTransactions(){
  const tbody=$('txBody');
  tbody.innerHTML='';
  if(!txCache.length){
    tbody.innerHTML='<tr><td class="empty" colspan="9" style="text-align:center;padding:20px">ยังไม่มีรายการ</td></tr>';
    $('txHint').textContent='';
    fitTable();
    return;
  }
  const mob=isMobile();
  const list=mob?txCache.slice(-shownMax):txCache;
  const more=mob?txCache.length-list.length:0;
  list.forEach(function(tx){
    const tr=document.createElement('tr');
    if(tx.pending)tr.style.opacity='.55';
    tr.innerHTML=
      '<td class="c-date">'+esc(tx.date)+'</td>'+
      '<td class="num c-carry">'+fmt(tx.carry)+'</td>'+
      '<td class="num" style="color:#059669">'+(tx.deposit?fmt(tx.deposit):'-')+'</td>'+
      '<td class="num" style="color:#dc2626">'+(tx.withdraw?fmt(tx.withdraw):'-')+'</td>'+
      '<td class="num" style="color:#d97706">'+(tx.transfer?fmt(tx.transfer):'-')+'</td>'+
      '<td class="num"><b>'+fmt(tx.balance)+'</b></td>'+
      '<td class="c-by">'+esc(tx.by||'')+'</td>'+
      '<td class="c-note">'+esc(tx.note||'')+'</td>'+
      '<td style="white-space:nowrap">'+(tx.pending?'⏳':
        '<div class="acts"><button class="btn-blue btn-sm" aria-label="แก้ไข" onclick="editTx('+Number(tx.rowIndex)+')"><span class="t">แก้ไข</span><span class="i">✏️</span></button> '+
        '<button class="btn-red btn-sm" aria-label="ลบ" onclick="deleteTx('+Number(tx.rowIndex)+')"><span class="t">ลบ</span><span class="i">🗑️</span></button></div>')+
      '</td>';
    tbody.appendChild(tr);
  });
  $('txHint').textContent=mob
    ? 'แสดง '+list.length+' รายการล่าสุด (ทั้งหมด '+txCache.length+' รายการ)'
    : (txCache.length>visRows()
        ? 'แสดง '+visRows()+' รายการล่าสุด (ทั้งหมด '+txCache.length+' รายการ) · เลื่อนขึ้นเพื่อดูรายการก่อนหน้า'
        : 'ทั้งหมด '+txCache.length+' รายการ');
  fitTable();
}

/* ให้กล่องตารางสูงพอดี 5 แถวล่าสุด แล้วเลื่อนลงล่างสุดอัตโนมัติ */
/* ย่อฟอนต์ทั้งตารางให้ครบทุกคอลัมน์พอดีความกว้างจอ (padding/ปุ่มใช้หน่วย em จึงย่อตามกัน) */
function fitScale(){
  const wrap=$('tableWrap'),tbl=wrap.querySelector('table');
  if(!wrap.offsetParent)return;
  tbl.style.fontSize='16px';tbl.style.width='auto';
  const nat=tbl.offsetWidth,avail=wrap.clientWidth;
  tbl.style.width='';
  const size=16*avail/nat;
  tbl.style.fontSize=(size>=14.4)?'':Math.max(size,6).toFixed(2)+'px';
}
function fitTable(){
  fitScale();
  const wrap=$('tableWrap');
  const rows=$('txBody').rows;
  wrap.style.maxHeight='';
  if(isMobile())return;                 // มือถือ: ไม่ใช้กรอบเลื่อนซ้อน ให้เลื่อนทั้งหน้าตามปกติ
  const n=visRows();
  if(rows.length<=n||!wrap.offsetParent)return;
  const first=rows[rows.length-n],last=rows[rows.length-1];
  const h=wrap.querySelector('thead').offsetHeight+(last.offsetTop+last.offsetHeight-first.offsetTop)
    +(parseFloat(getComputedStyle(last).marginBottom)||0);
  wrap.style.maxHeight=(h+2)+'px';
  wrap.scrollTop=wrap.scrollHeight;
}
window.addEventListener('resize',fitTable);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTable);
if(window.matchMedia){const mq=window.matchMedia('(max-width:700px)');(mq.addEventListener?mq.addEventListener('change',function(){renderTransactions();}):mq.addListener(function(){renderTransactions();}));}
function shortDate(d){const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(d||'');return m?m[2]+'/'+m[1]:d;}

/* ---------- ฟอร์ม เพิ่ม/แก้ไข ---------- */
function resetForm(keepStatus){
  editingRow=null;
  $('addDate').value=todayStr();
  $('addDeposit').value='';
  $('addWithdraw').value='';
  $('addTransfer').value='';
  $('addBy').value=defaultBy();
  $('addNote').value='';
  $('formTitle').textContent='➕ เพิ่มรายการใหม่';
  $('saveBtn').textContent='บันทึกรายการ';
  $('cancelEditBtn').classList.add('hidden');
  $('formBox').classList.remove('editing');
  if(keepStatus!==true)setStatus('');
}

function editTx(rowIndex){
  const tx=txCache.find(function(t){return t.rowIndex===rowIndex;});
  if(!tx)return;
  editingRow=rowIndex;
  $('addDate').value=/^\d{4}-\d{2}-\d{2}$/.test(tx.date)?tx.date:'';
  $('addDeposit').value=tx.deposit||'';
  $('addWithdraw').value=tx.withdraw||'';
  $('addTransfer').value=tx.transfer||'';
  $('addBy').value=tx.by||'';
  $('addNote').value=tx.note||'';
  $('formTitle').textContent='✏️ แก้ไขรายการวันที่ '+tx.date;
  $('saveBtn').textContent='บันทึกการแก้ไข';
  $('cancelEditBtn').classList.remove('hidden');
  $('formBox').classList.add('editing');
  setStatus('');
  $('formBox').scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- บันทึกแบบเร็ว: แถวขึ้นทันที แล้วเขียนลงชีตเบื้องหลัง ---------- */

/* คำนวณยอดยกมา/คงเหลือในหน้าเว็บทันที (ให้แถวขึ้นก่อนที่ชีตจะตอบ) */
function recompute(list,base){
  let bal=Number(base)||0;
  list.forEach(function(t){
    t.carry=bal;
    bal=Math.round((bal+(Number(t.deposit)||0)-(Number(t.withdraw)||0)-(Number(t.transfer)||0))*100)/100;
    t.balance=bal;
  });
}

/* แก้ตารางในหน้าเว็บทันที (optimistic) */
function applyLocal(kind,row,rowIndex){
  const base=txCache.length?(Number(txCache[0].carry)||0):0;
  if(kind!=='add')txCache=txCache.filter(function(t){return t.rowIndex!==rowIndex;});
  if(kind!=='delete'){
    const nt={rowIndex:-1,date:row.date,deposit:row.deposit,withdraw:row.withdraw,
              transfer:row.transfer,by:row.by,note:row.note,pending:true};
    let i=txCache.length;
    while(i>0&&String(txCache[i-1].date)>String(nt.date))i--;
    txCache.splice(i,0,nt);
  }
  recompute(txCache,base);
  renderTransactions();
}

/* ส่งงานเข้าคิวทีละอัน (ชีตเขียนทีละรายการ ปลอดภัย) แล้วรับรายการจริงกลับมาใน request เดียว */
function runOp(tab,params,msg){
  let fin=false;
  const end=function(){if(!fin){fin=true;pendingOps--;}};
  pendingOps++;
  opQueue=opQueue.then(function(){
    return api(params,90000);
  }).then(function(json){
    end();
    if(!json.ok)throw new Error(json.error||'ไม่สำเร็จ');
    txStore[tab]=json.data||[];
    if(tab===currentTabName&&!pendingOps){
      txCache=clone(txStore[tab]);
      renderTransactions();
      setStatus(msg,'ok');
    }
  }).catch(function(e){
    end();
    setStatus('❌ '+e.message,'err');
    if(tab===currentTabName)loadTransactions();   // กลับไปใช้ข้อมูลจริงจากชีต
  });
}

/* ---- ดึงข้อมูลจากชีตเองเป็นระยะ: แก้/ลบ/เพิ่มในชีตโดยตรงแล้วหน้านี้เปลี่ยนตามภายในไม่กี่วินาที ---- */
const POLL_MS=8000, RECV_POLL_MS=60000;
let txPoll=null, rcPoll=null, recvLoading=false;
function refreshIfIdle(){
  if(!currentTabName||pendingOps||busy||editingRow!==null||document.hidden)return;
  loadTransactions(true);
}
async function refreshReceivers(){
  if(recvLoading||!adminPassword||busy||document.hidden)return;
  const ae=document.activeElement;
  if(ae&&(ae.id==='receiverSelect'||ae.id==='studentSelect'))return;   // กำลังเลือกอยู่ ไม่รบกวน
  recvLoading=true;
  try{
    const data=await api({action:'getReceivers'},90000);
    if(data.ok&&JSON.stringify(data.data)!==JSON.stringify(receiverData))applyReceivers(data.data);
  }catch(e){}finally{recvLoading=false;}
}
function startPolling(){
  stopPolling();
  txPoll=setInterval(refreshIfIdle,POLL_MS);
  rcPoll=setInterval(refreshReceivers,RECV_POLL_MS);
}
function stopPolling(){clearInterval(txPoll);clearInterval(rcPoll);}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){refreshIfIdle();refreshReceivers();}
});
window.addEventListener('focus',function(){refreshIfIdle();refreshReceivers();});
window.addEventListener('beforeunload',function(e){
  if(pendingOps){e.preventDefault();e.returnValue='';}
});

function saveTransaction(){
  if(!currentTabName)return alert('กรุณาเลือกผู้ฝากก่อน');
  const isEdit=editingRow!==null;
  const date=$('addDate').value;
  const deposit=Number($('addDeposit').value)||0;
  const withdraw=Number($('addWithdraw').value)||0;
  const transfer=Number($('addTransfer').value)||0;
  if(!date&&!isEdit)return alert('กรุณาระบุวันที่');
  if(!deposit&&!withdraw&&!transfer)return alert('กรุณากรอกยอดเงินอย่างน้อย 1 ช่อง');
  if(deposit<0||withdraw<0||transfer<0)return alert('ยอดเงินต้องไม่ติดลบ');

  const tab=currentTabName,by=$('addBy').value.trim(),note=$('addNote').value.trim();
  const old=isEdit?txCache.find(function(t){return t.rowIndex===editingRow;}):null;
  const params={action:isEdit?'updateTransaction':'addTransaction',tabName:tab,date:date,
                deposit:deposit,withdraw:withdraw,transfer:transfer,by:by,note:note};
  if(isEdit){params.rowIndex=editingRow;params.oldDate=old?old.date:'';}

  applyLocal(isEdit?'edit':'add',
    {date:date||(old&&old.date)||todayStr(),deposit:deposit,withdraw:withdraw,transfer:transfer,by:by,note:note},
    editingRow);
  resetForm(true);
  setStatus('⏳ กำลังบันทึกลงชีต...','info');
  runOp(tab,params,isEdit?'✅ แก้ไขสำเร็จ':'✅ บันทึกสำเร็จ');
}

function deleteTx(rowIndex){
  const tx=txCache.find(function(t){return t.rowIndex===rowIndex;});
  if(!tx)return;
  const detail='\n\nวันที่ '+tx.date+'\nฝาก '+fmt(tx.deposit)+' / ถอน '+fmt(tx.withdraw)+' / โอน '+fmt(tx.transfer);
  if(!confirm('ยืนยันการลบรายการนี้?'+detail+'\n\nลบแล้วกู้คืนจากหน้านี้ไม่ได้ และยอดคงเหลือของรายการถัดไปจะถูกคำนวณใหม่'))return;
  const tab=currentTabName;
  applyLocal('delete',null,rowIndex);
  if(editingRow===rowIndex)resetForm(true);
  setStatus('⏳ กำลังลบ...','info');
  runOp(tab,{action:'deleteTransaction',tabName:tab,rowIndex:rowIndex,oldDate:tx.date},'🗑️ ลบรายการแล้ว');
}

async function syncTabs(){
  if(busy)return;
  busy=true;
  const btn=$('syncBtn');
  const old=btn.textContent;
  btn.disabled=true;
  btn.textContent='⏳ กำลัง Sync (อาจใช้เวลา 1-2 นาที)...';
  try{
    const json=await api({action:'syncNow'},300000);
    if(!json.ok)throw new Error(json.error||'');
    await reloadReceivers();
    alert('✅ Sync ข้อมูลแท็บใหม่เรียบร้อยแล้ว');
  }catch(e){
    alert('Sync ไม่สำเร็จ: '+e.message);
  }finally{
    busy=false;
    btn.disabled=false;
    btn.textContent=old;
  }
}

window.addEventListener('DOMContentLoaded',function(){
  let saved=null;
  try{saved=localStorage.getItem('admin_pass');}catch(e){}
  if(saved){$('adminPassword').value=saved;login();}
});
