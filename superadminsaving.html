 *
 *  ขั้นตอน
 *   A) วาง "ส่วน ก" ไว้ใต้บรรทัด   let busy=false;
 *   B) ลบฟังก์ชันเดิมเหล่านี้ทิ้ง: onStudentChange, loadTransactions,
 *      renderTransactions, saveTransaction, deleteTx, refreshPdf
 *   C) วาง "ส่วน ข" แทน  (ส่วน HTML / CSS ไม่ต้องแก้)
 * ============================================================ */

/* ===================== ส่วน ก : ตัวแปรใหม่ ===================== */
const txStore = {};            // รายการล่าสุดของแต่ละแท็บ (สลับนักเรียนแล้วเห็นทันที)
const pdfTimers = {};          // รอหลังบันทึกล่าสุด ค่อยสร้าง PDF ครั้งเดียว
const PDF_DELAY = 8000;        // 8 วินาที
let opQueue = Promise.resolve(), pendingOps = 0;
function clone(a) { return JSON.parse(JSON.stringify(a || [])); }

/* ===================== ส่วน ข : ฟังก์ชัน ===================== */

/* คำนวณยอดยกมา/คงเหลือในหน้าเว็บทันที (ให้แถวขึ้นก่อนที่ชีตจะตอบ) */
function recompute(list, base) {
  let bal = Number(base) || 0;
  list.forEach(function (t) {
    t.carry = bal;
    bal = Math.round((bal + (Number(t.deposit) || 0) - (Number(t.withdraw) || 0) - (Number(t.transfer) || 0)) * 100) / 100;
    t.balance = bal;
  });
}

/* แก้ตารางในหน้าเว็บทันที (optimistic) */
function applyLocal(kind, row, rowIndex) {
  const base = txCache.length ? (Number(txCache[0].carry) || 0) : 0;
  if (kind !== 'add') txCache = txCache.filter(function (t) { return t.rowIndex !== rowIndex; });
  if (kind !== 'delete') {
    const nt = { rowIndex: -1, date: row.date, deposit: row.deposit, withdraw: row.withdraw,
                 transfer: row.transfer, by: row.by, note: row.note, pending: true };
    let i = txCache.length;
    while (i > 0 && String(txCache[i - 1].date) > String(nt.date)) i--;
    txCache.splice(i, 0, nt);
  }
  recompute(txCache, base);
  renderTransactions();
}

/* ส่งงานเข้าคิวทีละอัน (ชีตเขียนทีละรายการ ปลอดภัย) แล้วรับรายการจริงกลับมาใน request เดียว */
function runOp(tab, params, msg) {
  let fin = false;
  const end = function () { if (!fin) { fin = true; pendingOps--; } };
  pendingOps++;
  opQueue = opQueue.then(function () {
    return api(params, 90000);
  }).then(function (json) {
    end();
    if (!json.ok) throw new Error(json.error || 'ไม่สำเร็จ');
    txStore[tab] = json.data || [];
    if (tab === currentTabName && !pendingOps) {
      txCache = clone(txStore[tab]);
      renderTransactions();
      setStatus(msg + ' · PDF จะอัปเดตอัตโนมัติ', 'ok');
    }
    markPdf(tab);
  }).catch(function (e) {
    end();
    setStatus('❌ ' + e.message, 'err');
    if (tab === currentTabName) loadTransactions();   // กลับไปใช้ข้อมูลจริงจากชีต
  });
}

/* สร้าง PDF แบบรอให้หยุดบันทึกก่อน (ไม่สร้างทุกครั้งที่กดบันทึก) */
function markPdf(tab) {
  clearTimeout(pdfTimers[tab]);
  pdfTimers[tab] = setTimeout(function () { firePdf(tab); }, PDF_DELAY);
}
function firePdf(tab) {
  clearTimeout(pdfTimers[tab]);
  delete pdfTimers[tab];
  api({ action: 'regeneratePdf', tabName: tab }, 180000).then(function (j) {
    if (tab !== currentTabName || pendingOps) return;
    setStatus(j.ok ? '✅ บันทึกแล้ว · อัปเดต PDF แล้ว'
                   : '⚠️ บันทึกแล้ว แต่อัปเดต PDF ไม่สำเร็จ (' + (j.error || '') + ')', j.ok ? 'ok' : 'err');
  }).catch(function (e) {
    if (tab === currentTabName && !pendingOps) setStatus('⚠️ บันทึกแล้ว แต่อัปเดต PDF ไม่สำเร็จ (' + e.message + ')', 'err');
  });
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) Object.keys(pdfTimers).forEach(function (t) { firePdf(t); });
});
window.addEventListener('beforeunload', function (e) {
  if (pendingOps) { e.preventDefault(); e.returnValue = ''; }
});

function onStudentChange() {
  const tab = $('studentSelect').value;
  pdfJob++;
  setStatus('');
  editingRow = null;
  if (!tab) { currentTabName = ''; $('txSection').classList.add('hidden'); return; }
  currentTabName = tab;
  txCache = clone(txStore[tab]);                    // แสดงจากแคชทันที แล้วค่อยรีเฟรชเบื้องหลัง
  $('txSection').classList.remove('hidden');
  $('txTitle').textContent = 'รายการเดินบัญชี: ' + tab;
  resetForm();
  if (txStore[tab]) renderTransactions(); else $('txBody').innerHTML = '';
  loadTransactions();
}

async function loadTransactions() {
  const tabName = currentTabName;
  if (!tabName) return;
  if (!txStore[tabName]) $('txHint').textContent = 'กำลังโหลดรายการ...';
  try {
    const data = await api({ action: 'getTransactions', tabName: tabName }, 90000);
    if (tabName !== currentTabName || pendingOps) return;   // ระหว่างมีงานค้างในคิว ใช้ผลจากคิวแทน
    if (!data.ok) throw new Error(data.error || 'ไม่ทราบสาเหตุ');
    txStore[tabName] = data.data || [];
    txCache = clone(txStore[tabName]);
    renderTransactions();
  } catch (e) {
    if (tabName === currentTabName) {
      $('txHint').textContent = '';
      alert('โหลดข้อมูลไม่สำเร็จ: ' + e.message);
    }
  }
}

function renderTransactions() {
  const tbody = $('txBody');
  tbody.innerHTML = '';
  if (!txCache.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px">ยังไม่มีรายการ</td></tr>';
    $('txHint').textContent = '';
    fitTable();
    return;
  }
  txCache.forEach(function (tx) {
    const tr = document.createElement('tr');
    if (tx.pending) tr.style.opacity = '.55';
    tr.innerHTML =
      '<td>' + esc(tx.date) + '</td>' +
      '<td class="num">' + fmt(tx.carry) + '</td>' +
      '<td class="num" style="color:#059669">' + (tx.deposit ? fmt(tx.deposit) : '-') + '</td>' +
      '<td class="num" style="color:#dc2626">' + (tx.withdraw ? fmt(tx.withdraw) : '-') + '</td>' +
      '<td class="num" style="color:#d97706">' + (tx.transfer ? fmt(tx.transfer) : '-') + '</td>' +
      '<td class="num"><b>' + fmt(tx.balance) + '</b></td>' +
      '<td>' + esc(tx.by || '') + '</td>' +
      '<td>' + esc(tx.note || '') + '</td>' +
      '<td style="white-space:nowrap">' + (tx.pending ? '⏳ กำลังบันทึก' :
        '<button class="btn-blue btn-sm" onclick="editTx(' + Number(tx.rowIndex) + ')">แก้ไข</button> ' +
        '<button class="btn-red btn-sm" onclick="deleteTx(' + Number(tx.rowIndex) + ')">ลบ</button>') +
      '</td>';
    tbody.appendChild(tr);
  });
  $('txHint').textContent = txCache.length > VISIBLE_ROWS
    ? 'แสดง ' + VISIBLE_ROWS + ' รายการล่าสุด (ทั้งหมด ' + txCache.length + ' รายการ) · เลื่อนขึ้นเพื่อดูรายการก่อนหน้า'
    : 'ทั้งหมด ' + txCache.length + ' รายการ';
  fitTable();
}

function saveTransaction() {
  if (!currentTabName) return alert('กรุณาเลือกผู้ฝากก่อน');
  const isEdit = editingRow !== null;
  const date = $('addDate').value;
  const deposit = Number($('addDeposit').value) || 0;
  const withdraw = Number($('addWithdraw').value) || 0;
  const transfer = Number($('addTransfer').value) || 0;
  if (!date && !isEdit) return alert('กรุณาระบุวันที่');
  if (!deposit && !withdraw && !transfer) return alert('กรุณากรอกยอดเงินอย่างน้อย 1 ช่อง');
  if (deposit < 0 || withdraw < 0 || transfer < 0) return alert('ยอดเงินต้องไม่ติดลบ');

  const tab = currentTabName, by = $('addBy').value.trim(), note = $('addNote').value.trim();
  const old = isEdit ? txCache.find(function (t) { return t.rowIndex === editingRow; }) : null;
  const params = { action: isEdit ? 'updateTransaction' : 'addTransaction', tabName: tab, date: date,
                   deposit: deposit, withdraw: withdraw, transfer: transfer, by: by, note: note, skipPdf: 1 };
  if (isEdit) { params.rowIndex = editingRow; params.oldDate = old ? old.date : ''; }

  applyLocal(isEdit ? 'edit' : 'add',
    { date: date || (old && old.date) || todayStr(), deposit: deposit, withdraw: withdraw, transfer: transfer, by: by, note: note },
    editingRow);
  resetForm(true);
  setStatus('⏳ กำลังบันทึกลงชีต...', 'info');
  runOp(tab, params, isEdit ? '✅ แก้ไขสำเร็จ' : '✅ บันทึกสำเร็จ');
}

function deleteTx(rowIndex) {
  const tx = txCache.find(function (t) { return t.rowIndex === rowIndex; });
  if (!tx) return;
  const detail = '\n\nวันที่ ' + tx.date + '\nฝาก ' + fmt(tx.deposit) + ' / ถอน ' + fmt(tx.withdraw) + ' / โอน ' + fmt(tx.transfer);
  if (!confirm('ยืนยันการลบรายการนี้?' + detail + '\n\nลบแล้วกู้คืนจากหน้านี้ไม่ได้ และยอดคงเหลือของรายการถัดไปจะถูกคำนวณใหม่')) return;
  const tab = currentTabName;
  applyLocal('delete', null, rowIndex);
  if (editingRow === rowIndex) resetForm(true);
  setStatus('⏳ กำลังลบ...', 'info');
  runOp(tab, { action: 'deleteTransaction', tabName: tab, rowIndex: rowIndex, oldDate: tx.date, skipPdf: 1 }, '🗑️ ลบรายการแล้ว');
}
